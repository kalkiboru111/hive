# Hive Bot Configuration
# Edit this file to customize your WhatsApp bot.
# See examples/cloudy-deliveries/config.yaml for a complete example.

# A blank starting point. Run `hive run <this dir>` and open the dashboard —
# the onboarding wizard will set your business name and build your menu for you.
business:
  name: ""
  currency: "USD"
  welcome: |
    Welcome! 👋

    Reply with a number:
    1. 📋 View Menu
    2. 📦 My Orders
    3. 🎟️ Redeem Voucher
    4. ℹ️ About Us

# Empty to start — add items from the dashboard (onboarding).
menu: []

# Uncomment and configure delivery settings:
# delivery:
#   fee: 5.00
#   estimate_minutes: [30, 45]

# WhatsApp numbers that receive order notifications:
admin_numbers: []

# Customize bot response messages (supports {id}, {items}, {total}, {currency}, {location}, {estimate}, {code}, {amount} placeholders):
# messages:
#   order_confirmed: "✅ Order #{id} confirmed! Send your location."
#   order_delivered: "🎉 Order #{id} delivered! Enjoy!"

dashboard:
  port: 8080
  enabled: true
  # bind_host defaults to 127.0.0.1 (loopback only — not exposed to the network).
  # To reach it from another machine, set bind_host: "0.0.0.0" AND set auth_token
  # (and ideally put it behind a TLS reverse proxy).
  # bind_host: "127.0.0.1"
  # auth_token: "change-me"   # HTTP Basic auth: any username, password = this token

# Reality Network integration.
# Each bot is its own rApp. Before snapshots are accepted, you must deploy your
# rApp on the testnet and point hive at the same key — see docs/DEPLOY.md.
# Leave disabled until you've completed deployment.
network:
  enabled: false
  l0_url: "http://143.110.227.9:9000"
