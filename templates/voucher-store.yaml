# Voucher Store Template
# Perfect for: gift cards, community credits, loyalty programs, prepaid services

business:
  name: "My Vouchers"
  currency: "USD"
  welcome: |
    Welcome! 🎁

    Reply with a number:
    1. 🎟️ Buy Vouchers
    2. 💳 Check Balance
    3. ♻️ Redeem Voucher
    4. ℹ️ About Us
  about: "Digital vouchers for local businesses. Buy, gift, and redeem via WhatsApp."

menu:
  - name: "$10 Credit"
    price: 10.00
    emoji: "💵"
    description: "Redeemable at any participating merchant"
  - name: "$25 Credit"
    price: 25.00
    emoji: "💶"
    description: "5% bonus — $26.25 value"
  - name: "$50 Credit"
    price: 50.00
    emoji: "💷"
    description: "10% bonus — $55 value"
  - name: "$100 Credit"
    price: 100.00
    emoji: "💸"
    description: "15% bonus — $115 value"
  - name: "Gift Card (Custom Amount)"
    price: 0.00
    emoji: "🎁"
    description: "Choose your amount — perfect for gifting"

admin_numbers:
  - "+1234567890"  # REPLACE with your WhatsApp number

messages:
  order_confirmed: "✅ Voucher #{id} purchased!\n🎟️ Your code: {code}\n💰 Value: {currency}{total}\n\nShare this code with anyone to redeem."
  order_received_admin: "🔔 Voucher Sale #{id}\n\nAmount: {currency}{total}\nCode: {code}\nBuyer: {location}"
  order_delivered: "🎁 Your voucher #{id} is ready to use! Share the code or redeem it yourself."
  voucher_created: "🎟️ New voucher: {code} — {currency}{amount} value"
  voucher_redeemed: "✅ Voucher {code} redeemed! {currency}{amount} credited."
  voucher_invalid: "❌ Invalid or already-used voucher code."

