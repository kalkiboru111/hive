# Community Store Template
# Perfect for: co-ops, local markets, farmer's markets, craft vendors

business:
  name: "Community Market"
  currency: "USD"
  welcome: |
    Welcome to Community Market! 🌾

    Reply with a number:
    1. 🛒 View Products
    2. 📦 My Orders
    3. 🎟️ Redeem Voucher
    4. ℹ️ About Us
  about: "Fresh, local goods from your neighbors. Supporting our community, one order at a time."

menu:
  - name: "Farm Fresh Eggs (dozen)"
    price: 6.00
    emoji: "🥚"
    description: "Free-range, local farm"
  - name: "Organic Vegetables Box"
    price: 15.00
    emoji: "🥬"
    description: "Seasonal mix — carrots, greens, tomatoes, etc."
  - name: "Honey (500g)"
    price: 12.00
    emoji: "🍯"
    description: "Raw, unfiltered local honey"
  - name: "Fresh Bread (sourdough)"
    price: 8.00
    emoji: "🍞"
    description: "Baked daily, naturally leavened"
  - name: "Handmade Soap (3 bars)"
    price: 10.00
    emoji: "🧼"
    description: "Lavender, rosemary, or citrus"
  - name: "Jam (250ml jar)"
    price: 7.00
    emoji: "🍓"
    description: "Strawberry, blueberry, or apricot"

delivery:
  fee: 5.00
  estimate_minutes: [60, 120]

admin_numbers:
  - "+1234567890"  # REPLACE with your WhatsApp number

messages:
  order_confirmed: "✅ Order #{id} confirmed!\n📍 Send your delivery address or pick-up location\n⏱ Ready in: {estimate}"
  order_received_admin: "🔔 New Order #{id}\n\n{items}\n\nTotal: {currency}{total}\n📍 {location}\n\nPrepare order — reply READY {id} when packed"
  order_delivered: "🎉 Order #{id} delivered! Thank you for supporting local! 🌱"
  voucher_created: "🎟️ Community credit {code} — {currency}{amount}"
  voucher_redeemed: "✅ Credit {code} used! {currency}{amount} off this order."
  voucher_invalid: "❌ Invalid credit code."

dashboard:
  port: 8080
  enabled: true

network:
  enabled: false
  l0_url: "http://143.110.227.9:9000"
