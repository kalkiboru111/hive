# Salon & Beauty Booking Template
# Perfect for: hair salons, barbers, nail studios, spas

business:
  name: "My Salon"
  currency: "USD"
  welcome: |
    Welcome to My Salon! 💇‍♀️✨

    Reply with a number:
    1. 📋 View Services
    2. 📅 My Bookings
    3. 🎟️ Redeem Voucher
    4. ℹ️ About Us
  about: "Professional beauty services. Book your appointment via WhatsApp. Walk-ins welcome!"

