# Food Delivery Template
# Perfect for: restaurants, street food vendors, home kitchens

business:
  name: "My Kitchen"
  currency: "USD"
  welcome: |
    Welcome to My Kitchen! 🍽️

    Reply with a number:
    1. 📋 View Menu
    2. 📦 My Orders
    3. 🎟️ Redeem Voucher
    4. ℹ️ About Us
  about: "Fresh, homemade meals delivered to your door. Made with love. ❤️"

menu:
  - name: "Burger & Fries"
    price: 12.00
    emoji: "🍔"
    description: "Classic beef burger with crispy fries"
  - name: "Pizza Margherita"
    price: 15.00
    emoji: "🍕"
    description: "Fresh mozzarella, basil, tomato sauce"
  - name: "Chicken Wings (6pc)"
    price: 10.00
    emoji: "🍗"
    description: "Crispy wings with your choice of sauce"
  - name: "Caesar Salad"
    price: 8.00
    emoji: "🥗"
    description: "Romaine, parmesan, croutons, Caesar dressing"
  - name: "Soda"
    price: 2.00
    emoji: "🥤"
    description: "Coke, Sprite, or Fanta"

delivery:
  fee: 3.00
  estimate_minutes: [30, 45]

admin_numbers:
  - "+1234567890"  # REPLACE with your WhatsApp number

messages:
  order_confirmed: "✅ Order #{id} confirmed!\n📍 Please send your delivery address\n⏱ Estimated delivery: {estimate}"
  order_received_admin: "🔔 New Order #{id}\n\n{items}\n\nTotal: {currency}{total}\n📍 {location}\n\nReply DONE {id} when delivered"
  order_delivered: "🎉 Order #{id} has been delivered! Enjoy your meal! 😊\n\nRate us: ⭐⭐⭐⭐⭐"
  voucher_created: "🎟️ Voucher {code} created — {currency}{amount} discount"
  voucher_redeemed: "✅ Voucher {code} applied! {currency}{amount} off this order."
  voucher_invalid: "❌ Invalid voucher code."

dashboard:
  port: 8080
  enabled: true

network:
  enabled: false
  l0_url: "http://143.110.227.9:9000"
