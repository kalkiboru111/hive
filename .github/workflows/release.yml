name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-19

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev protobuf-compiler

      - name: Build
        run: cargo build --release

      - name: Rename binary
        run: mv target/release/hive hive-linux-x86_64

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hive-linux-x86_64
          path: hive-linux-x86_64

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-19

      - name: Install deps
        run: brew install protobuf

      - name: Build
        run: cargo build --release

      - name: Rename binary
        run: mv target/release/hive hive-macos-arm64

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hive-macos-arm64
          path: hive-macos-arm64

  release:
    needs: [build-linux-x64, build-macos-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd binaries
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: binaries/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
